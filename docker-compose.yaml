services:
  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=ecommerce_tracker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  airflow:
    image: apache/airflow:2.7.1
    environment:
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres/ecommerce_tracker
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _PIP_ADDITIONAL_REQUIREMENTS=beautifulsoup4 pandas requests SQLAlchemy psycopg2-binary
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./sql:/opt/airflow/sql
    ports:
      - "8080:8080"
    command: standalone
    depends_on:
      - postgres

volumes:
  postgres_data: